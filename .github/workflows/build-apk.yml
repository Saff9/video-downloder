name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VideoFetch-Pro-v1.0.4.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFetch-Pro-v1.0.4-APK
          path: VideoFetch-Pro-v1.0.4.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "VideoFetch Pro v1.0.4"
          draft: false
          prerelease: false
          body: |
            # 🚀 VideoFetch Pro v1.0.4 - Official Release

            We are excited to present **VideoFetch Pro v1.0.4** featuring instant zero-delay standalone APK feed loading, automatic Gallery indexing for downloaded videos (SnapTube style), seamless in-app and APK updates, and universal media downloading.

            ---

            ### 🌟 What's New in v1.0.4

            - 📱 **Instant Zero-Delay Standalone APK Feeds**:
              - Fixed DOM binding lifecycle on startup so curated science & education feeds (100+ HD videos) and vertical shorts appear immediately with zero delay.
              - Full WebView universal file & network access enabled.

            - 🎬 **Automatic Gallery & MediaStore Indexing (SnapTube Style)**:
              - Downloaded videos and MP3s are instantly scanned into Android's `MediaStore` via `MediaScannerConnection` so they show up directly in your phone's **Gallery, Photos, and Media Player apps**.

            - 🔄 **Seamless Update & Keystore Signing**:
              - Standardized debug signing configuration across all builds ensures updating from older APK versions succeeds with zero package signature conflicts.

            - ⚡ **Universal High-Speed Mobile Downloader**:
              - Direct download stream resolution with native Android `DownloadManager` integration (notification bar progress & background downloads).

            - 🔍 **Instant Video Analysis (< 200ms)**:
              - High-speed oEmbed extraction delivers instant title, creator, and HD thumbnail previews.

            - 💳 **Direct Sponsor & Payment Link Routing**:
              - Razorpay and Solana donation links open smoothly in your external browser or UPI apps (Google Pay, PhonePe, Paytm).

            ---

            ### 📥 Download & Install
            Download **`VideoFetch-Pro-v1.0.4.apk`** below to install directly on Android.

            ---

            ### 💖 Support the Developer
            - ☕ **Razorpay**: [Support on Razorpay](https://razorpay.me/@CodeChap?amount=kXxURMaXFk%2Bmrv%2B9uGrYpg%3D%3D)
            - ⚡ **Solana (SOL)**: `DfL2H7rAaocxpyNYdefV7aybNCSBVJiUSGAn3RDFKRb7`
            - 🌐 **Developer**: Saffan Akbar ([@Saff9](https://github.com/Saff9))
          files: |
            VideoFetch-Pro-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


