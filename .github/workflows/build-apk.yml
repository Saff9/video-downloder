name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VideoFetch-Pro-v1.0.6.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFetch-Pro-v1.0.6-APK
          path: VideoFetch-Pro-v1.0.6.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "VideoFetch Pro v1.0.6"
          draft: false
          prerelease: false
          body: |
            # 🚀 VideoFetch Pro v1.0.6 - Official Release

            We are excited to present **VideoFetch Pro v1.0.6** with full YouTube embed player fixes on Android WebView via WebViewAssetLoader, completely responsive History and Bookmarks management, zero-delay science feed and vertical shorts, and automatic MediaStore Gallery indexing.

            ---

            ### 🌟 What's New in v1.0.6

            - 🎬 **Fixed Video Player for Long & Short Videos**:
              - Integrated AndroidX `WebViewAssetLoader` to serve assets from a secure HTTPS origin (`https://appassets.androidplatform.net`), resolving YouTube embed origin restrictions (Error 150/101) in Android's WebView.
              - Optimized embed URLs and removed restrictive iframe referrerpolicy tags for smooth, instant playback.

            - 📜 **Fully Responsive History & Bookmarks View**:
              - Completely redesigned mobile responsive layout for Watch History, Saved Bookmarks, and Download History.
              - Touch-optimized filter bar, clear log controls, and subtab navigation.

            - 📱 **Instant Zero-Delay Standalone APK Feeds**:
              - Bundled curated science & education library (100+ HD videos) and vertical reels (50+ shorts) that render immediately on startup.

            - 📥 **SnapTube-Style Gallery Indexing**:
              - Completed media downloads are scanned into Android's `MediaStore` so they appear instantly in your Gallery / Photos app with their full video titles preserved.

            - 💳 **Direct Sponsor & Payment Link Routing**:
              - Razorpay and Solana donation links open smoothly in your external browser or UPI apps.

            ---

            ### 📥 Download & Install
            Download **`VideoFetch-Pro-v1.0.6.apk`** below to install directly on Android.

            ---

            ### 💖 Support the Developer
            - ☕ **Razorpay**: [Support on Razorpay](https://razorpay.me/@CodeChap?amount=kXxURMaXFk%2Bmrv%2B9uGrYpg%3D%3D)
            - ⚡ **Solana (SOL)**: `DfL2H7rAaocxpyNYdefV7aybNCSBVJiUSGAn3RDFKRb7`
            - 🌐 **Developer**: Saffan Akbar ([@Saff9](https://github.com/Saff9))
          files: |
            VideoFetch-Pro-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


