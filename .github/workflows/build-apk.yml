name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VideoFetch-Pro-v1.0.7.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFetch-Pro-v1.0.7-APK
          path: VideoFetch-Pro-v1.0.7.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "VideoFetch Pro v1.0.7"
          draft: false
          prerelease: false
          body: |
            # 🚀 VideoFetch Pro v1.0.7 - Official Release

            We are pleased to release **VideoFetch Pro v1.0.7** with a full cinema-grade video player layout, fixed snap-scroll vertical Shorts playback engine, responsive edge-to-edge mobile UI, and automated Gallery media indexing.

            ---

            ### 🌟 What's New in v1.0.7

            - 🎬 **Cinema-Grade Modal Video Player**:
              - Completely restructured modal overlay with edge-to-edge mobile presentation, eliminating boxed/contained iframe rendering on phone screens.
              - Responsive 16:9 widescreen viewport with high-definition rendering, backdrop blur, creator meta badges, and in-player sponsor action bar.

            - ⚡ **Fixed Vertical Shorts Playback Engine**:
              - Resolved YouTube Shorts player playback by optimizing embed parameters (removed playlist loops and origin conflicts).
              - Added active scroll-driven reel centering and touch layer pass-through so vertical shorts start and autoplay instantly on mobile.

            - 📜 **Enhanced History & Bookmarks System**:
              - Responsive subtab navigation for Watch History (up to 100 items), Saved Bookmarks, and Download Records.
              - Touch-optimized filter bar and activity controls.

            - 📱 **Zero-Delay Standalone Mode**:
              - Built-in curated science, physics, technology, and engineering video feeds that load instantly offline or without a local server.

            - 📥 **Direct MediaStore Gallery Indexing**:
              - Downloaded videos and audio files are automatically scanned and indexed to appear directly in Android Gallery/Photos.

            - 💳 **Official Sponsor & Donation Support**:
              - Quick access to Razorpay and Solana donation channels.

            ---

            ### 📥 Download & Install
            Download **`VideoFetch-Pro-v1.0.7.apk`** below to install directly on your Android device.

            ---

            ### 💖 Support the Developer
            - ☕ **Razorpay**: [Support on Razorpay](https://razorpay.me/@CodeChap?amount=kXxURMaXFk%2Bmrv%2B9uGrYpg%3D%3D)
            - ⚡ **Solana (SOL)**: `DfL2H7rAaocxpyNYdefV7aybNCSBVJiUSGAn3RDFKRb7`
            - 🌐 **Developer**: Saffan Akbar ([@Saff9](https://github.com/Saff9))
          files: |
            VideoFetch-Pro-v1.0.7.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


