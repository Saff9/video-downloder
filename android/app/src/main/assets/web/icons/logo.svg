<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#0f0f11" />
      <stop offset="100%" stop-color="#050507" />
    </linearGradient>

    <!-- Vibrant Crimson Accent Gradient -->
    <linearGradient id="primaryRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff334b" />
      <stop offset="50%" stop-color="#e60026" />
      <stop offset="100%" stop-color="#990014" />
    </linearGradient>

    <!-- Electric Cyan Accent Gradient (representing Speed/Science) -->
    <linearGradient id="electricBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ff002b" flood-opacity="0.45" />
    </filter>

    <filter id="innerBorder" x="0" y="0" width="100%" height="100%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#ffffff" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Squircle Base with Metallic Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="6" />

  <!-- Outer Orbital Arc (Fetch Speed Stream) -->
  <path d="M 120 256 A 136 136 0 1 1 392 256" fill="none" stroke="url(#electricBlue)" stroke-width="14" stroke-linecap="round" stroke-dasharray="160 30" opacity="0.85" />
  
  <path d="M 392 256 A 136 136 0 0 1 140 330" fill="none" stroke="url(#primaryRed)" stroke-width="14" stroke-linecap="round" opacity="0.9" />

  <!-- Core Dynamic Fetch Shield & Play Emblem -->
  <g filter="url(#glow)">
    <!-- Fetch Arrow / Play Glyph Base -->
    <path d="M 210 160 C 196 151 178 161 178 178 L 178 334 C 178 351 196 361 210 352 L 334 274 C 347 266 347 246 334 238 Z" fill="url(#primaryRed)" />
    
    <!-- Sharp Modern Forward Accent Dart -->
    <path d="M 292 247 L 230 208 C 223 203 214 208 214 217 L 214 295 C 214 304 223 309 230 304 L 292 265 C 298 261 298 251 292 247 Z" fill="#ffffff" />
  </g>

  <!-- Speed Pulse Dots -->
  <circle cx="360" cy="180" r="10" fill="#38bdf8" />
  <circle cx="390" cy="220" r="6" fill="#38bdf8" opacity="0.6" />
</svg>