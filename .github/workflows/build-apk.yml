name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VideoFetch-Pro-v1.0.8.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFetch-Pro-v1.0.8-APK
          path: VideoFetch-Pro-v1.0.8.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "VideoFetch Pro v1.0.8"
          draft: false
          prerelease: false
          body: |
            # 🚀 VideoFetch Pro v1.0.8 - Official Release

            We are pleased to release **VideoFetch Pro v1.0.8** with a verified high-definition YouTube science feed, 100% active YouTube Shorts playback engine, standard Chrome Android User-Agent configuration, and seamless offline fallback.

            ---

            ### 🌟 What's New in v1.0.8

            - 🎬 **100% Real, Active YouTube Science Feed**:
              - Replaced legacy/placeholder video items with fully verified, world-renowned science content from Veritasium, 3Blue1Brown, Kurzgesagt, SmarterEveryDay, Mark Rober, Real Engineering, Practical Engineering, and NileRed.
              - Completely eliminated "Video unavailable" errors on all categories.

            - ⚡ **Fixed Vertical Shorts Playback Engine**:
              - Integrated 100% verified, active YouTube Shorts and vertical experiments that load and play immediately on both mobile and desktop.
              - Upgraded embed transport to `youtube-nocookie.com` with clean parameters for instant auto-centering and playback.

            - 🌐 **Clean Android Chrome User-Agent**:
              - Configured standard modern Chrome mobile User-Agent in `MainActivity.kt` to prevent YouTube embed blocking or bot detection.

            - 📱 **Cinema-Grade Modal Player**:
              - Seamless edge-to-edge modal display on mobile screens with responsive 16:9 widescreen layout and instant backdrop blur.

            - 📥 **Automated MediaStore Gallery Indexing**:
              - Downloaded videos and audio files appear immediately in Android's Gallery / Photos app.

            - 💳 **Official Sponsor & Donation Support**:
              - Direct Razorpay UPI and Solana donation links.

            ---

            ### 📥 Download & Install
            Download **`VideoFetch-Pro-v1.0.8.apk`** below to install directly on your Android device.

            ---

            ### 💖 Support the Developer
            - ☕ **Razorpay**: [Support on Razorpay](https://razorpay.me/@CodeChap?amount=kXxURMaXFk%2Bmrv%2B9uGrYpg%3D%3D)
            - ⚡ **Solana (SOL)**: `DfL2H7rAaocxpyNYdefV7aybNCSBVJiUSGAn3RDFKRb7`
            - 🌐 **Developer**: Saffan Akbar ([@Saff9](https://github.com/Saff9))
          files: |
            VideoFetch-Pro-v1.0.8.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


