name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Rename APK for Release
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk VideoFetch-Pro-v1.0.5.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoFetch-Pro-v1.0.5-APK
          path: VideoFetch-Pro-v1.0.5.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create / Update GitHub Release
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "VideoFetch Pro v1.0.5"
          draft: false
          prerelease: false
          body: |
            # 🚀 VideoFetch Pro v1.0.5 - Official Release

            We are proud to release **VideoFetch Pro v1.0.5** with complete standalone mobile APK fixes, instant feed & shorts rendering, high-speed client-side media resolution, and direct Android Gallery integration.

            ---

            ### 🌟 What's New in v1.0.5

            - 📱 **Instant Zero-Delay Standalone APK Feeds & Shorts**:
              - Fixed TDZ variable initialization bug in feed and shorts lifecycle so all curated science videos and vertical reels appear immediately on startup.
              - Full offline database bundled with 100+ high-definition curated science videos and 50+ vertical shorts.

            - 🎬 **Automatic Gallery & MediaStore Indexing (SnapTube Style)**:
              - Downloaded videos and MP3s are verified upon completion and instantly scanned into Android's `MediaStore` via `MediaScannerConnection` so they show up directly in your phone's **Gallery, Photos, and Media Player apps**.
              - Downloaded files now save with their proper full video titles instead of generic timestamps.

            - ⚡ **Universal High-Speed Mobile Downloader**:
              - Direct client-side video & MP3 stream resolution with native Android `DownloadManager` integration (notification bar progress & background downloading).
              - Prevents any invalid `file:///api/download` relative URL errors in standalone APK mode.

            - 🎨 **Polished Thumbnail & UI Layout**:
              - Sleek 16:9 constrained preview card with modern radial badge fallback.

            - 💳 **Direct Sponsor & Payment Link Routing**:
              - Razorpay and Solana donation links open smoothly in your external browser or UPI apps (Google Pay, PhonePe, Paytm).

            ---

            ### 📥 Download & Install
            Download **`VideoFetch-Pro-v1.0.5.apk`** below to install directly on Android.

            ---

            ### 💖 Support the Developer
            - ☕ **Razorpay**: [Support on Razorpay](https://razorpay.me/@CodeChap?amount=kXxURMaXFk%2Bmrv%2B9uGrYpg%3D%3D)
            - ⚡ **Solana (SOL)**: `DfL2H7rAaocxpyNYdefV7aybNCSBVJiUSGAn3RDFKRb7`
            - 🌐 **Developer**: Saffan Akbar ([@Saff9](https://github.com/Saff9))
          files: |
            VideoFetch-Pro-v1.0.5.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


